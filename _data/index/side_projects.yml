- name: GWGEN
  i18n: gwgen
  gh_user: ARVE-Research
  repo: gwgen
  icon: fa-cloud-sun-rain
  desc:
    en: A global weather generator for daily data
    de: Ein globaler Wettergenerator für tägliche Wetterdaten
  long_desc:
    en: |
      This synthesis of FORTRAN and Python is a globally applicable weather
      generator parameterized through a global dataset of weather station data
      with more than 50 million individual daily records. It downscales wind
      speed, precipitation, temperature, and cloud cover from monthly to daily
      resolution.

      More at [arve-research.gihub.io/gwgen](https://arve-research.github.io/gwgen/)
    de: |
      Diese Synthese aus FORTRAN und Python ist ein global anwendbarer
      Wettergenerator der anhand eines globalen Datensatzes täglicher
      Wetterstationsdaten mit über 50 Millionen individueller Aufzeichnungen
      parameterisiert wurde. Er skaliert Windgeschwindigkeit, Niederschlag,
      Temperatur und Bewölkung von monatlicher auf tägliche Auflösung.

      Mehr informationen gibt es auf
      [arve-research.gihub.io/gwgen](https://arve-research.github.io/gwgen/).
  skills:
    - Github
    - Open Source Software development
    - Data Analysis
    - Coding
    - Statistics
    - Conceptualization
    - Python
    - FORTRAN
    - R
    - Postgres

- name: IUCm
  i18n: iucm
  gh_user: Chilipp
  repo: iucm
  icon: fa-city
  desc:
    en: A model to simulate urban growth and transformation with the objective of minimising the energy required for transportation.
    de: Ein Model zur Simulation urbaner Wachstums- und Transformationsprozesse bei gleichzeitiger Minimierung von benötigter Transport-Energie
  long_desc:
    en: |
      The Integrated Urban Complexity model (IUCm) is a relatively simple
      probablistic computational model to compute 'climate-smart urban forms',
      that cut down emissions related to energy consumption from urban mobility.

      More at [iucm.readthedocs.io](https://iucm.readthedocs.io).
    de: |
      Das 'Integrated Urban Complexity model (IUCm)' is ein relativ einfaches
      probabilistisches Computermodell um sogennante 'climate-smart urban forms'
      zu berechnen. Diese verringern transport-bedingte Emissionen durch den
      Energieverbrauch von urbaner Mobilität.

      Mehr Informtation gibt es auf
      [iucm.readthedocs.io](https://iucm.readthedocs.io).
  skills:
