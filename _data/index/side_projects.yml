  repo: docrep
  icon_style: fab
  icon: fa-python
  desc:
    en: Python package for docstring repetition
    de: Python Programm für die Wiederverwertung von Dokumentationen
  long_desc:
    en: |
      The documentation repetition module (docrep) targets developpers that
      develop complex and nested Python APIs and helps them to create a
      well-documented software.

      More at [docrep.readthedocs.io](https://docrep.readthedocs.io).
    de: |
      Das 'documentation repetition module (docrep)' ist ein Python Programm
