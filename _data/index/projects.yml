- name: DASF
  i18n: dasf
  repo: dasf-messaging-python
  codebase_user: dasf
  desc:
    en: Remote procedure call framework for secure and flexible data analysis
    de: Programmfernaufruf (Remote Procedure Call) für sichere und flexible daten analyse
  img: /static/assets/img/landing/dasf_logo_v2_640.png
  long_desc:
    en: |
      The Data Analytics Software Framework DASF supports scientists to conduct 
      data analysis in distributed IT infrastructures by sharing data analysis 
      tools and data. For this purpose, DASF defines a remote procedure call 
      (RPC) messaging protocol that uses a central message broker instance. 
      Scientists can augment their tools and data with this protocol to share 
      them with others or re-use them in different contexts.

      I am a core developer of this project developing the python base, as well
      as the django-based message broker, the React-based web components for
      usage in websites, as well as an Agentic AI implementation.
    de: |
      Das Data Analytics Software Framework (DASF) unterstützt Wissenschaftler bei der Durchführung 
      von Datenanalysen in verteilten IT-Infrastrukturen durch die gemeinsame Nutzung von 
      Datenanalysewerkzeugen und Daten. Zu diesem Zweck definiert DASF ein Messaging-Protokoll für Remote Procedure Calls 
      (RPC), das eine zentrale Message-Broker-Instanz nutzt. 
      Wissenschaftler können ihre Werkzeuge und Daten mit diesem Protokoll erweitern, um 
      sie mit anderen zu teilen oder in verschiedenen Kontexten wiederzuverwenden.

      Ich bin einer der Hauptentwickler dieses Projekts und entwickle sowohl die Python-Basis als auch
      den auf Django basierenden Message Broker, die auf React basierenden Webkomponenten für den
      Einsatz in Websites sowie eine Agentic-KI-Implementierung.

  skills:
    - Version Control
    - Open Source Software development
    - Web Development and Deployment
    - Javascript
    - Coding
    - Conceptualization
    - Python
    - Kubernetes
    - Agentic AI

- name: Research Software Engineering
  i18n: rse
  repo: ''
  codebase_user: hcdc/software-templates
  desc:
    en: Software templates for Packaging and Deployment
    de: Software Templates für Packaging und Deployment
  icon_style: fas
  icon: fa-code
  long_desc:
    en: |
      I have developed and maintained software templates that support the 
      packaging, deployment, and long-term sustainability of research software. 
      Using Cookiecutter, I provide standardized project structures that 
      accelerate software creation and promote best practices. The templates 
      incorporate a modular Git-based approach, enabling flexible customization, 
      collaborative development, and reliable version control. To ensure quality 
      and reliability, they include comprehensive unit testing. I also leverage 
      Cruft to manage template updates and reduce boilerplate code, minimizing 
      technical debt and maintenance effort. These templates improve code 
      consistency, documentation, onboarding, and reproducibility, helping 
      researchers build robust, maintainable, and deployable software more 
      efficiently.
    de: |
      Ich habe Software Templates entwickelt und gepflegt, die die Paketierung, 
      Bereitstellung und langfristige Nachhaltigkeit von Forschungssoftware 
      unterstützen. Mithilfe von Cookiecutter stelle ich standardisierte 
      Projektstrukturen bereit, die die Softwareentwicklung beschleunigen und 
      bewährte Verfahren fördern. Die Vorlagen basieren auf einem modularen, 
      Git-basierten Ansatz, der eine flexible Anpassung, kollaborative 
      Entwicklung und zuverlässige Versionskontrolle ermöglicht. Um Qualität und 
      Zuverlässigkeit zu gewährleisten, umfassen sie umfassende Unit-Tests. 
      Zudem nutze ich Cruft, um Vorlagenaktualisierungen zu verwalten und 
      Boilerplate-Code zu reduzieren, wodurch technische Schulden und der 
      Wartungsaufwand minimiert werden. Diese Vorlagen verbessern die Konsistenz 
      des Codes, die Dokumentation, die Einarbeitung und die Reproduzierbarkeit 
      und helfen Forschern dabei, robuste, wartbare und einsatzfähige Software 
      effizienter zu entwickeln.
  skills:
    - Version Control
    - Open Source Software development
    - Web Development and Deployment
    - Javascript
    - Coding
    - Conceptualization
    - Python
    - Kubernetes
    - Teaching

- name: iSeaPower
  i18n: iseapower
  url: https://iseapower.hereon.de
  img: /static/assets/img/landing/iseapower-logo.png
  desc:
    en: A web-based decision-support platform for offshore operations.
    de: Eine webbasierte Plattform zur Entscheidungsunterstützung für Offshore-Einsätze.
  long_desc:
    en: |
      iSeaPower is a web-based decision-support platform designed to optimize 
      logistical planning for offshore operations. It is particularly useful for 
      activities with varying thresholds for wind speed and wave height—both in 
      harbor during loading and unloading, and offshore during installation or 
      maintenance. The tool supports risk-informed decision-making and efficient 
      scheduling, helping operators reduce downtime and costs. The rapidly 
      growing offshore renewable energy sector can easily benefit from iSeaPower.

      For me, this project is a usecase for building an Agentic AI-based digital
      twin. I am implementing a chatbot in this frontend to make science-based
      and trustworthy decision using the data analysis software framework (DASF).
      This project touches all, data analysis, deployment, agentic AI, etc.
    de: |
      iSeaPower ist eine webbasierte Plattform zur Entscheidungsunterstützung, die darauf ausgelegt ist,
      die logistische Planung für Offshore-Einsätze zu optimieren. Sie eignet sich besonders für
      Aktivitäten mit variierenden Schwellenwerten für Windgeschwindigkeit und Wellenhöhe - sowohl im
      Hafen beim Be- und Entladen als auch auf See während der Installation oder
      Wartung. Das Tool unterstützt eine risikobewusste Entscheidungsfindung und eine effiziente
      Terminplanung und hilft Betreibern so, Ausfallzeiten und Kosten zu reduzieren. Der schnell
      wachsende Sektor der erneuerbaren Offshore-Energie kann leicht von iSeaPower profitieren.

      Für mich ist dieses Projekt ein Anwendungsfall für die Entwicklung eines auf Agentic AI basierenden digitalen
      Zwillings. Ich implementiere in diesem Frontend einen Chatbot, um wissenschaftlich fundierte
      und vertrauenswürdige Entscheidungen mithilfe des Datenanalyse-Software-Frameworks (DASF) zu treffen.
      In diesem Projekt kommt alles zusammen, Datenanalyse, Deployment, Agentic AI, etc.
  skills:
    - Version Control
    - Open Source Software development
    - Web Development and Deployment
    - Javascript
    - Coding
    - Conceptualization
    - Python
    - Kubernetes
    - Statistics
    - Visualization
    - Data Analysis
    - Agentic AI


- name: Kubernetes OpenShift Deployment
  i18n: kubernetes
  repo: helm-chart-template
  codebase_user: hcdc/software-templates
  img: /static/assets/img/landing/kubernetes.png
  img_title: Google, Public domain, via Wikimedia Commons
  desc:
    en: Software templates and Helm Charts for secure and sustainable deployment via Kubernetes
    de: Software Templates und Helm Charts für ein sichere und nachhaltige Deployments über Kubernetes
  long_desc:
    en: |
      Web applications have become increasingly vital in scientific settings,
      facilitating knowledge transfer, collaboration, and data publication.
      Establishing a secure IT infrastructure to accommodate a diverse range of
      web applications and technologies however poses significant challenges.
      Addressing this issue, I developed a secure yet adaptable approach to deploy
      and maintain multiple web applications.

      The concept leverages Kubernetes
      OpenShift, employing a standardized, git-centric workflow to document web
      applications, responsibilities, and technologies. Security measures include
      regular image updates, micro-segmentation, and least privilege roles. The
      concept embraces reproducibility and division of labor through the
      utilization of cookiecutter templates, Helm charts, and Ansible. It
      incorporates essential concepts such as CI/CD, scalability, and
      reproducibility, benefiting the entire research institution.
    de: |
      Webanwendungen sind in der Wissenschaft immer wichtiger geworden,
      Sie erleichtern den Wissenstransfer, die Zusammenarbeit und die Veröffentlichung von Daten.
      Die Einrichtung einer sicheren IT-Infrastruktur für ein breites Spektrum von
      Webanwendungen und -technologien unterzubringen, stellt jedoch eine große Herausforderung dar.
      Deshalb habe ich ein sicheres und dennoch anpassungsfähiges Konzept für die Bereitstellung
      mehrere Webanwendungen entwickelt.

      Das Konzept nutzt Kubernetes OpenShift und verwendet einen
      standardisierten, Git-zentrierten Arbeitsablauf um Web Anwendungen,
      Verantwortlichkeiten und Technologien zu dokumentieren. Zu den Sicherheitsmaßnahmen gehören
      regelmäßige Image-Updates, Mikro-Segmentierung und _least privilege_ Rollen.
      Das Konzept umfasst Reproduzierbarkeit und Arbeitsteilung durch die
      Verwendung von Cookiecutter-Vorlagen, Helm Charts und Ansible. Es
      umfasst wesentliche Konzepte wie CI/CD, Skalierbarkeit und
      Reproduzierbarkeit, wovon die gesamte Forschungseinrichtung profitiert.
  skills:
    - Version Control
    - Open Source Software development
    - Web Development and Deployment
    - Conceptualization
    - Kubernetes
